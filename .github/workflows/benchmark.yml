# The full benchmark, started by hand: every workload at the sizes it declares, on each OS. Each group of workloads
# runs in its own job, which keeps every job well under the hosted runners' six-hour limit; the report job gathers the
# results of all of them into one summary.
#
# Hosted runners share their hardware with other jobs, and their disks are virtual: compare engines within one run,
# where they met the same conditions, rather than one run with another.
name: Benchmark
run-name: Benchmark ${{ inputs.group }} on ${{ inputs.os }} ${{ inputs.jmh-args }}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner to measure on
        type: choice
        options: [all, ubuntu-latest, windows-latest, macos-latest]
        default: all
      group:
        description: Group of workloads to run
        type: choice
        options: [all, commit, ingest, read, limits-write, limits-query]
        default: all
      jmh-args:
        description: 'Extra JMH arguments, for example: -p engine=rocksdb,sqlite -p messages=1000000'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: ${{ matrix.group }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || format('["{0}"]', inputs.os)) }}
        # The groups' patterns live in the run step: matrix include entries for groups a dispatch leaves out would
        # become jobs of their own, without an OS
        group: ${{ fromJSON(inputs.group == 'all' && '["commit","ingest","read","limits-write","limits-query"]' || format('["{0}"]', inputs.group)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The templates of the larger workloads take several GB
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: mvn -B -ntp package -DskipTests

      - name: Describe the runner
        run: |
          {
            echo "## ${{ matrix.group }} on ${{ matrix.os }}"
            echo
            echo "- CPUs: $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"
            echo "- Java: $(java -version 2>&1 | head -1)"
            echo "- Disk: $(df -h "$RUNNER_TEMP" 2>/dev/null | tail -1)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # A failing workload does not stop the others (-foe false); the last step fails the job if any did.
      - name: Run the workloads
        env:
          LEDGER_BENCH_DIR: ${{ runner.temp }}/bench
          GROUP: ${{ matrix.group }}
          JMH_ARGS: ${{ inputs.jmh-args }}
          RESULTS: results/${{ matrix.os }}.json
          LOG: results/${{ matrix.os }}.log
        run: |
          case "$GROUP" in
            commit) PATTERN='cobalt\.(DurableCommit|GroupCommit|OfflineDrain|WebhookInbox)Benchmark' ;;
            ingest) PATTERN='cobalt\.(HistoryIngest|AppStateSync|ChatDelete)Benchmark' ;;
            read) PATTERN='cobalt\.(ChatPage|MessageLookup|Reopen)Benchmark' ;;
            limits-write) PATTERN='limits\.(RandomOverwrite|ParallelWriters|PinnedReader|LargeValue)Benchmark' ;;
            limits-query) PATTERN='limits\.(AdHocQuery|SqlIndexQuery|MultiProcessWriters)Benchmark' ;;
            *) echo "::error::Unknown group $GROUP"; exit 1 ;;
          esac
          mkdir -p results
          # JMH_ARGS is split into words on purpose
          java -jar benchmark/target/benchmarks.jar "$PATTERN" -foe false -rf json -rff "$RESULTS" $JMH_ARGS 2>&1 | tee "$LOG"

      - name: Summarize
        if: always() && hashFiles('results/*.json') != ''
        run: python .github/scripts/summarize.py "results/${{ matrix.os }}.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-${{ matrix.group }}
          path: results/
          retention-days: 90

      - name: Fail if a workload failed
        run: |
          if grep -q '<failure>' "results/${{ matrix.os }}.log"; then
            grep -B 12 -A 6 '<failure>' "results/${{ matrix.os }}.log" | grep -E '^# (Benchmark|Parameters)|Exception|Error' || true
            echo "::error::Some workloads failed; their results are missing from the summary"
            exit 1
          fi

  report:
    name: report
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: all

      - name: Summarize every runner
        run: |
          {
            echo "## Every runner"
            echo
            echo "Scores only; each job's summary has the percentiles and the disk and memory counters."
            echo
            find all -name '*.json' -print0 | xargs -0 python .github/scripts/summarize.py --by-os
          } >> "$GITHUB_STEP_SUMMARY"
