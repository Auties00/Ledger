# Pushes and pull requests: builds the benchmark and runs every workload once on small data on each OS, so a broken
# adapter or a native library missing on one platform shows up before a full run.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # A build that runs past its limit has a hung test: 40 minutes on Windows, whose builds took 15 to 21 (median 18,
      # 34 runs up to run 45862251156), and 30 elsewhere (ubuntu up to 12, macOS up to 17). The watchdog then records the
      # threads of every JVM into results/, each dump cut off after a minute since a JVM that cannot reach a safepoint
      # never answers one (macOS adds native stacks, which need no safepoint), and kills the JVMs so the build fails and
      # the log step uploads results/. It goes by the clock rather than by counting one-second sleeps, which drift on
      # Windows, and kills nothing once the build has ended, so a build that finishes during the dumps cannot take the
      # smoke run's JVM with it. A safepoint that takes longer than 30 seconds aborts its JVM, whose crash report names
      # the thread that does not stop.
      - name: Build
        run: |
          mkdir -p results
          if [ "$RUNNER_OS" = Windows ]; then limit=40; else limit=30; fi
          (
            end=$((SECONDS + limit * 60))
            while [ "$SECONDS" -lt "$end" ]; do
              sleep 5
              [ -f results/.built ] && exit 0
            done
            echo "The build ran past $limit minutes"
            for pid in $(jps -q); do
              name=$(jps -l | grep "^$pid " || true)
              if command -v sample > /dev/null; then
                sample "$pid" 3 -file "results/native-$pid.txt" > /dev/null 2>&1 &
              fi
              { echo "=== $name"; jcmd "$pid" Thread.print; } > "results/threads-$pid.txt" 2>&1 &
            done
            sleep 60
            [ -f results/.built ] && { echo "The build ended during the dumps; nothing killed"; exit 0; }
            if command -v taskkill > /dev/null; then taskkill //F //IM java.exe; else pkill -9 java; fi
          ) > results/watchdog.log 2>&1 &
          watchdog=$!
          set +e
          mvn -B -ntp package             "-Dledger.test.jvm=-XX:+IgnoreUnrecognizedVMOptions -XX:+UnlockDiagnosticVMOptions -XX:+SafepointTimeout -XX:SafepointTimeoutDelay=30000 -XX:+AbortVMOnSafepointTimeout"             2>&1 | tee results/build.log
          status=${PIPESTATUS[0]}
          touch results/.built
          wait "$watchdog"
          if [ -s results/watchdog.log ]; then
            echo "The build ran past $limit minutes; thread dumps are in the uploaded results/" >&2
            cat results/watchdog.log >&2
          fi
          exit "$status"

      # One short iteration of every workload; -foe stops at the first failure and fails the step.
      - name: Run every workload once
        env:
          LEDGER_BENCH_DIR: ${{ runner.temp }}/bench
        run: |
          mkdir -p results
          java -jar benchmark/target/benchmarks.jar -wi 0 -i 1 -r 1s -f 1 -foe true \
            -p messages=20000 -p keys=100000 -p valueSize=1048576 -p committers=8 -p processes=2 \
            -p backgroundWrites=100 -p batchSize=1000 \
            -rf json -rff results/smoke.json 2>&1 | tee results/smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize
        if: always() && hashFiles('results/smoke.json') != ''
        run: |
          {
            echo "## Smoke run on ${{ matrix.os }}"
            echo
            echo "One one-second iteration on small data: it shows that every workload runs, not how fast."
            echo
            python .github/scripts/summarize.py results/smoke.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: |
            results/
            **/hs_err_pid*.log
            **/target/surefire-reports/*.dumpstream
          retention-days: 14
